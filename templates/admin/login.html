{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniMS — Cổng Quản trị Viên Chuyên nghiệp (Admin Portal)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-base: #0B0F19;
      --bg-surface: #111827;
      --bg-elevated: #1E293B;
      --border-subtle: #1E293B;
      --border-strong: #334155;
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --accent: #38BDF8;
      --emerald: #059669;
      --emerald-glow: rgba(5, 150, 105, 0.15);
      --amber: #D97706;
      --rose: #DC2626;
      --text-main: #F8FAFC;
      --text-body: #E2E8F0;
      --text-muted: #94A3B8;
      --text-subtle: #64748B;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', Consolas, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.08) 0px, transparent 50%);
      color: var(--text-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .login-container {
      width: 100%;
      max-width: 460px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 18px;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.05);
      overflow: hidden;
      animation: containerFadeIn 0.35s ease-out;
    }

    @keyframes containerFadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-header {
      padding: 36px 36px 28px;
      text-align: center;
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.08) 0%, transparent 100%);
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
    }

    .brand-icon {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, #1E293B, #0F172A);
      border: 1px solid #334155;
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      color: var(--accent);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
      margin-bottom: 18px;
    }

    .brand-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .badge-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      font-family: var(--font-mono);
      letter-spacing: 0.2px;
    }

    .badge-local {
      background: rgba(5, 150, 105, 0.15);
      color: #34D399;
      border: 1px solid rgba(5, 150, 105, 0.35);
    }

    .badge-secure {
      background: rgba(37, 99, 235, 0.15);
      color: var(--accent);
      border: 1px solid rgba(37, 99, 235, 0.35);
    }

    .login-body {
      padding: 30px 36px 36px;
    }

    .alert-error {
      background: rgba(220, 38, 38, 0.12);
      border: 1px solid rgba(220, 38, 38, 0.3);
      color: #FCA5A5;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 22px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.45;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 15px;
      color: var(--text-subtle);
      font-size: 0.95rem;
      pointer-events: none;
      transition: color 0.2s;
    }

    .form-input {
      width: 100%;
      background: #0B0F19;
      border: 1px solid var(--border-strong);
      color: var(--text-main);
      padding: 13px 14px 13px 44px;
      border-radius: 10px;
      font-size: 0.94rem;
      font-family: var(--font-sans);
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
      background: #111827;
    }

    .input-wrapper:focus-within .input-icon {
      color: var(--accent);
    }

    .toggle-pwd {
      position: absolute;
      right: 15px;
      color: var(--text-subtle);
      cursor: pointer;
      font-size: 0.92rem;
      transition: color 0.2s;
      padding: 4px;
    }

    .toggle-pwd:hover {
      color: var(--accent);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #FFFFFF;
      border: none;
      padding: 13px 20px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
      margin-top: 6px;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #1D4ED8, #1E40AF);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .info-box {
      margin-top: 24px;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px dashed var(--border-strong);
      border-radius: 10px;
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.55;
    }

    .info-box strong {
      color: var(--accent);
    }

    .info-box code {
      font-family: var(--font-mono);
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 5px;
      border-radius: 4px;
      color: #E2E8F0;
    }

    .footer-links {
      margin-top: 20px;
      text-align: center;
      font-size: 0.82rem;
    }

    .footer-links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .footer-links a:hover {
      color: #93C5FD;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="brand-icon">
        <i class="fas fa-shield-halved"></i>
      </div>
      <h1 class="brand-title">UniMS Admin Portal</h1>
      <p class="brand-subtitle">Cổng Quản trị Doanh nghiệp & Giám sát SSMS</p>
      <div class="badge-container">
        <span class="badge badge-local"><i class="fas fa-network-wired"></i> Node: 127.0.0.1</span>
        <span class="badge badge-secure"><i class="fas fa-lock"></i> Isolated Admin</span>
      </div>
    </div>

    <div class="login-body">
      {% if error %}
      <div class="alert-error">
        <i class="fas fa-circle-exclamation" style="margin-top: 2px;"></i>
        <div>{{ error }}</div>
      </div>
      {% endif %}

      <form method="POST" action="/admin/login/{% if next %}?next={{ next }}{% endif %}">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label" for="username">Tài khoản Quản trị</label>
          <div class="input-wrapper">
            <i class="fas fa-user-shield input-icon"></i>
            <input
              type="text"
              id="username"
              name="username"
              class="form-input"
              placeholder="Username admin..."
              value="{{ username|default:'' }}"
              required
              autofocus
              autocomplete="username"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu Xác thực</label>
          <div class="input-wrapper">
            <i class="fas fa-key input-icon"></i>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Nhập mật khẩu..."
              required
              autocomplete="current-password"
            />
            <i class="fas fa-eye toggle-pwd" id="toggle-pwd" title="Hiện mật khẩu"></i>
          </div>
        </div>

        <button type="submit" class="btn-submit">
          <i class="fas fa-arrow-right-to-bracket"></i> Đăng nhập Quản trị viên
        </button>
      </form>

      <div class="footer-links">
        <a href="/review/"><i class="fas fa-arrow-left"></i> Chuyển sang Cổng Người dùng (User Portal)</a>
      </div>
    </div>
  </div>

  <script>
    const togglePwd = document.getElementById('toggle-pwd');
    const pwdInput = document.getElementById('password');
    if (togglePwd && pwdInput) {
      togglePwd.addEventListener('click', () => {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        togglePwd.classList.toggle('fa-eye', !isPassword);
        togglePwd.classList.toggle('fa-eye-slash', isPassword);
      });
    }
  </script>
</body>
</html>
