# Nginx Reverse Proxy Configuration for UniMS
# Defense-in-Depth Layer 1: Edge Security & Rate Limiting

# Khai báo zone giới hạn tần suất request (Rate Limiting)
limit_req_zone $binary_remote_addr zone=general_api_zone:10m rate=25r/s;
limit_req_zone $binary_remote_addr zone=auth_api_zone:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=admin_zone:10m rate=10r/s;

# Giới hạn số lượng kết nối đồng thời từ 1 IP (Connection Limiting)
limit_conn_zone $binary_remote_addr zone=addr_conn_zone:10m;

server {
    listen 80;
    server_name localhost _;

    # 1. Chống DoS / Slowloris & Buffer Overflow
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    client_body_buffer_size 128k;
    client_max_body_size 20M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # 2. Giới hạn kết nối đồng thời (tối đa 25 kết nối từ 1 IP)
    limit_conn addr_conn_zone 25;

    # 3. Security Headers cứng ở tầng Web Server
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 4. Phục vụ Static Files trực tiếp qua Nginx (giảm tải triệt để cho Gunicorn)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 5. Khóa chặt trang Admin (/admin/) ở mức Nginx
    location /admin/ {
        # Chỉ cho phép localhost và subnet mạng nội bộ
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;   # Docker bridge network
        allow 192.168.0.0/16;  # LAN nội bộ
        allow 10.0.0.0/8;      # LAN nội bộ
        deny all;

        limit_req zone=admin_zone burst=15 nodelay;

        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Ghi đè X-Real-IP bằng remote socket IP thực tế -> Triệt tiêu hoàn toàn IP Spoofing
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # 6. Bảo vệ API Đăng nhập (/api/login/ & /api/register/) chống Brute-force
    location ~* ^/api/(login|register)/ {
        limit_req zone=auth_api_zone burst=5 nodelay;

        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # 7. Reverse Proxy toàn bộ request còn lại tới Gunicorn
    location / {
        limit_req zone=general_api_zone burst=30 nodelay;

        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
